name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the evtxkit test suite
        run: python run_tests.py evtxkit

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -f Dockerfile.evtxkit -t evtxkit:ci-test .

      - name: Smoke-test the image actually runs
        run: docker run --rm evtxkit:ci-test --help

  push-to-registry:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push, tagged with the commit SHA
        run: |
          docker build -f Dockerfile.evtxkit \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/socscript:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/socscript:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/socscript:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/socscript:latest

  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -f Dockerfile.evtxkit -t $ECR_REGISTRY/evtxkit:${{ github.sha }} .
          docker push $ECR_REGISTRY/evtxkit:${{ github.sha }}

      - name: Update task definition with the new image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          jq --arg IMAGE "$ECR_REGISTRY/evtxkit:${{ github.sha }}" \
            '.containerDefinitions[0].image = $IMAGE' \
            aws/task-definition.json > aws/task-definition-updated.json

      - name: Register the new task definition
        run: |
          aws ecs register-task-definition --cli-input-json file://aws/task-definition-updated.json

      - name: Run it on Fargate
        run: |
          aws ecs run-task \
            --cluster evtxkit-cluster \
            --task-definition evtxkit-task \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-03f1948ab29775079],securityGroups=[sg-0aac35e37f78a3f63],assignPublicIp=ENABLED}" \
            --region eu-north-1