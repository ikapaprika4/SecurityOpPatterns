name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the evtxkit test suite
        run: python run_tests.py evtxkit

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -f Dockerfile.evtxkit -t evtxkit:ci-test .

      - name: Smoke-test the image actually runs
        run: docker run --rm evtxkit:ci-test --help
