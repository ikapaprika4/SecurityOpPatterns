@"
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the evtxkit test suite
        run: python run_tests.py evtxkit

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -f Dockerfile.evtxkit -t evtxkit:ci-test .

      - name: Smoke-test the image actually runs
        run: docker run --rm evtxkit:ci-test --help

  push-to-registry:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: `${{ secrets.DOCKERHUB_USERNAME }}
          password: `${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push, tagged with the commit SHA
        run: |
          docker build -f Dockerfile.evtxkit \
            -t `${{ secrets.DOCKERHUB_USERNAME }}/socscript:`${{ github.sha }} \
            -t `${{ secrets.DOCKERHUB_USERNAME }}/socscript:latest .
          docker push `${{ secrets.DOCKERHUB_USERNAME }}/socscript:`${{ github.sha }}
          docker push `${{ secrets.DOCKERHUB_USERNAME }}/socscript:latest
"@ | Out-File -Encoding utf8 ci.yml