<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Windows event log analysis</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <header>
    <h1>Windows event log analysis</h1>
    <p class="lede">Upload a Windows event log and get back a report of the suspicious activity found in it.</p>
  </header>

  <form id="form" novalidate>
    <label class="field" for="code">
      <span>Access code</span>
      <input id="code" type="password" autocomplete="off" spellcheck="false">
    </label>

    <label id="drop" class="drop" for="file">
      <input id="file" type="file" accept=".evtx,.xml,.json,.jsonl,.ndjson,.txt,.log">
      <strong id="dropTitle">Choose a file, or drop it here</strong>
      <span id="dropHint">An .evtx file, or an Event Viewer export (.xml, .json, .jsonl)</span>
    </label>

    <button id="submit" class="btn primary" type="submit" disabled>Analyse</button>
  </form>

  <section id="samples" class="samples" hidden>
    <h3>No log at hand? Try a sample</h3>
    <p id="sampleNote" class="soft"></p>
    <ul id="sampleList"></ul>
  </section>

  <section id="progress" hidden>
    <ol class="steps">
      <li id="stepUpload">Upload</li>
      <li id="stepStart">Start</li>
      <li id="stepAnalyse">Analyse</li>
    </ol>
    <progress id="bar" max="100" value="0"></progress>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <p id="error" class="error" role="alert" hidden></p>

  <section id="result" hidden>
    <h2 id="verdict"></h2>
    <p id="summary" class="soft"></p>
    <div class="actions">
      <button id="download" class="btn primary" type="button">Download the report</button>
      <button id="again" class="btn" type="button">Analyse another file</button>
    </div>
    <pre id="report" tabindex="0"></pre>
  </section>

  <button id="retry" class="btn" type="button" hidden>Try again</button>
</main>
<script src="app.js"></script>
</body>
</html>
